name: CI/CD & Automated Multi-Platform Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag версии для ручного релиза (например: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-lint:
    name: 🧪 Валидация, Сборка и Линтинг
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Установка зависимостей
        run: npm install --legacy-peer-deps

      - name: 🔍 Проверка типов и синтаксиса (TypeScript Lint)
        run: npm run lint

      - name: 🛠️ Тестовая компиляция проекта
        run: npm run build

  package-and-release:
    name: 🚀 Сборка портативных пакетов и Авто-Релиз
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ⚙️ Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Установка зависимостей
        run: npm install --legacy-peer-deps

      - name: 🗜️ Установка утилит архивации (zip, tar)
        run: sudo apt-get update && sudo apt-get install -y zip tar

      - name: 📥 Предзагрузка оффлайн-бинарников Tesseract WASM и моделей
        run: node scripts/download-vendor-tesseract.js

      - name: 📦 Сборка дистрибутивов для всех платформ
        run: node scripts/package-releases.js

      - name: 📤 Загрузка артефактов сборки (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sup-director-portable-packages
          path: dist-releases/*.*
          retention-days: 30

      - name: 🏷️ Определение тега релиза
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.0-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 🌟 Создание GitHub Release с бинарными дистрибутивами
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: 🚀 СУП Руководителя Направления ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📌 Автономный релиз комплекса «Система Управления Руководителя» (SMB Offline)
            
            Данный релиз полностью автономен, **не требует установки**, компиляторов и доступа в Интернет.
            
            #### 📦 Доступные пакеты для платформ:
            - **`SUP-Director-*-Windows-Portable.zip`** — Готовая портативная версия для **Windows 10 / 11 / Server** (запуск в 1 клик через `Запуск_СУП.bat` с поддержкой Secure Context для реальных SMB-папок).
            - **`SUP-Director-*-AstraLinux-Portable.tar.gz`** — Автономный пакет для **Astra Linux (Special / Common Edition)** и РЕД ОС (запуск через `start_sup_astra.sh` или `.desktop`).
            - **`SUP-Director-*-SMB-NetworkShare.zip`** — Пакет для прямого развертывания на общем сетевом диске SMB (`\\SRV\SHARE\`) для совместной работы отдела.
            
            #### ⚡ Основные возможности и решения:
            - 📁 **Хранилище на SMB**: Полноценный Secure Context через встроенный локальный микро-хост, разблокирующий вызовы `window.showDirectoryPicker()` к реальным сетевым шарам SMB без установки Node/Python.
            - 🔒 **Конкурентные блокировки**: `.lock` файлы в `/data/locks/` с авто-таймаутом 15 мин.
            - 📋 **Канбан-доска**: Drag-and-Drop, статусы, фильтры, % готовности.
            - 📅 **Календарь и План**: Недельный и месячный графики с контролем дедлайнов.
            - 📊 **Диаграмма Ганта**: Векторный график MS Project на чистом SVG.
            - 📄 **Генератор Word (.docx)**: Автоподстановка реквизитов через PizZip и Docxtemplater.
            - 📷 **Настоящий оффлайн OCR**: Полноценные WASM-бинарники Tesseract.js и обученные языковые модели `rus.traineddata.gz` + `eng.traineddata.gz` прямо в архиве.
            - 🧮 **Спецкалькуляторы**: Расчет НДС 20%/10%/0%, рабочих сроков (без сб/вс), ФОТ и EVM (SPI/CPI).
          files: |
            dist-releases/*.zip
            dist-releases/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
